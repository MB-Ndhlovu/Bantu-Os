[package]
name = "bantu-shell"
version = "0.1.0"
edition = "2021"
description = "Bantu-OS AI Shell - Rust REPL for tool dispatch"
authors = ["Bantu-OS Team"]

[[bin]]
name = "bantu"
path = "src/main.rs"

[dependencies]
rustyline = { version = "=17.0.0", default-features = false, features = ["with-file-history"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
atty = "0.2"

[dev-dependencies]
tempfile = "3"
[[test]]
name = "integration_tests"
path = "src/tests/integration_tests.rs"
